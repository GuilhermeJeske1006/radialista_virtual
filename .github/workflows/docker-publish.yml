name: docker-publish

# Publica as imagens de producao no GHCR a cada push na master.
# O VPS da OVH puxa com: docker compose pull && docker compose up -d
on:
  push:
    branches: [master]
    paths:
      - "backend/**"
      - "frontend-painel/**"
      - "landing-page/**"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: locufy-backend
            context: backend
          - image: locufy-frontend
            context: frontend-painel
          - image: locufy-landing
            context: landing-page
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # NEXT_PUBLIC_* e INTERNAL_API_URL sao embutidos no `next build`;
      # os valores publicos ficam em Settings > Variables do repositorio.
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/guilhermejeske1006/${{ matrix.image }}:latest
            ghcr.io/guilhermejeske1006/${{ matrix.image }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=/api
            INTERNAL_API_URL=http://backend:8000
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_SENTRY_ENVIRONMENT=production
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
