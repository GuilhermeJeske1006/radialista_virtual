name: deploy

# Push na master: testes -> imagens no GHCR -> deploy no VPS da OVH.
# Se qualquer teste falhar, nada e publicado nem implantado.
on:
  push:
    branches: [master]
    paths:
      - "backend/**"
      - "frontend-painel/**"
      - "landing-page/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Um deploy por vez; um push novo espera o anterior terminar.
concurrency:
  group: deploy-producao
  cancel-in-progress: false

jobs:
  backend:
    uses: ./.github/workflows/backend-ci.yml

  frontend:
    uses: ./.github/workflows/frontend-ci.yml

  publish:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: locufy-backend
            context: backend
          - image: locufy-frontend
            context: frontend-painel
          - image: locufy-landing
            context: landing-page
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # NEXT_PUBLIC_* e INTERNAL_API_URL sao embutidos no `next build`;
      # os valores publicos ficam em Settings > Variables do repositorio.
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/guilhermejeske1006/${{ matrix.image }}:latest
            ghcr.io/guilhermejeske1006/${{ matrix.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=/api
            INTERNAL_API_URL=http://backend:8000
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_SENTRY_ENVIRONMENT=production
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      # A chave so consegue rodar /opt/locufy/deploy.sh no VPS (authorized_keys
      # com restrict,command=...). O sha vai como comando; usuario e token
      # temporario do GHCR vao pela entrada padrao.
      - name: Deploy no VPS
        env:
          SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.OVH_KNOWN_HOSTS }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n%s\n' "$GITHUB_ACTOR" "$GHCR_TOKEN" |
            ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes ubuntu@40.160.150.84 "$GITHUB_SHA"
