name: frontend-ci

on:
  push:
    branches: [master]
    paths:
      - "frontend-painel/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "frontend-painel/**"
      - ".github/workflows/frontend-ci.yml"

defaults:
  run:
    working-directory: frontend-painel

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend-painel/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck (tsc)
        run: npx tsc --noEmit

      - name: Testes (vitest)
        run: npm run test:coverage

      - name: Build (next build)
        run: npm run build
