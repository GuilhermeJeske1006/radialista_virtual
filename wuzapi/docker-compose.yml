services:
  wuzapi-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wuzapi
      POSTGRES_PASSWORD: ${WUZAPI_DB_PASSWORD:-wuzapi}
      POSTGRES_DB: wuzapi
    volumes:
      - wuzapi_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wuzapi"]
      interval: 5s
      timeout: 5s
      retries: 5

  wuzapi:
    image: asternic/wuzapi:latest
    restart: unless-stopped
    depends_on:
      wuzapi-db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      WUZAPI_ADMIN_TOKEN: ${WUZAPI_ADMIN_TOKEN}
      DB_URI: postgres://wuzapi:${WUZAPI_DB_PASSWORD:-wuzapi}@wuzapi-db:5432/wuzapi?sslmode=disable
      WUZAPI_GLOBAL_WEBHOOK: ${WUZAPI_GLOBAL_WEBHOOK:-}
      WEBHOOK_FORMAT: ${WEBHOOK_FORMAT:-json}
      WUZAPI_GLOBAL_ENCRYPTION_KEY: ${WUZAPI_GLOBAL_ENCRYPTION_KEY}
      WUZAPI_GLOBAL_HMAC_KEY: ${WUZAPI_GLOBAL_HMAC_KEY}
    volumes:
      - wuzapi_sessions:/app/sessions

volumes:
  wuzapi_db_data:
  wuzapi_sessions:
