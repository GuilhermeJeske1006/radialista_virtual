services:
  app-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: radialista
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:-radialista}
      POSTGRES_DB: radialista
    ports:
      - "5433:5432"
    volumes:
      - app_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radialista"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      app-db:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://radialista:${APP_DB_PASSWORD:-radialista}@app-db:5432/radialista
      REDIS_URL: redis://redis:6379/0
      WUZAPI_BASE_URL: http://host.docker.internal:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs

  frontend:
    build: ../frontend-painel
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"

volumes:
  app_db_data:
