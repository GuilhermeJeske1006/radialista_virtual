services:
  backend:
    volumes:
      - ./app:/app/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  frontend:
    build:
      context: ../frontend-painel
      target: dev
    volumes:
      - ../frontend-painel:/app
      - /app/node_modules
      - /app/.next
    command: ["npm", "run", "dev"]
